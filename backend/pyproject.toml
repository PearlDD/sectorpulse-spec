[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sectorpulse"
version = "0.1.0"
description = "AI-powered sector rotation analytics"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "langchain-anthropic>=0.3",
    "yfinance>=0.2",
    "fredapi>=0.5",
    "apscheduler>=3.10",
    "aiosqlite>=0.20",
    "sqlalchemy[asyncio]>=2.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "pydantic>=2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]
